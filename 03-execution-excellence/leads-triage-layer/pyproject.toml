[project]
name = "climatetech-casestudy-bai-leads-triage-layer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "joblib>=1.5.3",
    "matplotlib>=3.10.9",
    "numpy>=2.0.0",
    "ollama>=0.6.2",
    "pandas>=3.0.2",
    "psycopg2-binary>=2.9.12",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.2.2",
    "rich>=13.0.0",
    "scikit-learn>=1.8.0",
    "shap>=0.51.0",
    "sqlalchemy>=2.0.49",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
triage-api = "api.main:app"
triage = "cli.main:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/cli", "src/interpretation_layer", "src/memory_layer", "src/utils", "src/decision_layer", "src/db", "src/ml"]
